name: Weekly database backup

on:
  schedule:
    # Sundays at 09:00 UTC = 03:00 / 04:00 CT depending on DST.
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pg_dump (Postgres 17 client from PGDG)
        # Ubuntu 24.04's default repos cap at postgresql-client-16, but
        # Supabase serves Postgres 17 and pg_dump refuses to dump a server
        # newer than itself. Pull from the official PostgreSQL APT repo.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # --no-owner / --no-acl: dump won't try to set ownership on restore,
          # which avoids permission errors when restoring to a different DB.
          pg_dump --no-owner --no-acl --format=custom "$DATABASE_URL" > backup-$DATE.dump
          gzip -9 backup-$DATE.dump
          ls -lh backup-$DATE.dump.gz
          echo "BACKUP_FILE=backup-$DATE.dump.gz" >> $GITHUB_ENV

      - name: Upload to Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.BACKBLAZE_B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.BACKBLAZE_B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.BACKBLAZE_B2_BUCKET }}
        run: |
          pip install --quiet b2
          b2 account authorize "$B2_KEY_ID" "$B2_APP_KEY"
          b2 file upload "$B2_BUCKET" "$BACKUP_FILE" "weekly/$BACKUP_FILE"
